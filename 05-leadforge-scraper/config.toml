# -----------------------------------------------------------------------------
#  OPTIONAL CREDENTIALS  -- everything below is a free tier, nothing required.
#  Add with:  python run.py addkey hunter_api_key YOUR_KEY --section apis
# -----------------------------------------------------------------------------

[apis]
hunter_api_key  = ""     # hunter.io  -> 50 free lookups/month
apollo_api_key  = ""     # apollo.io  -> 900 free credits/year
snov_token      = ""     # snov.io    -> 50 free credits/month
meta_access_token = ""   # graph.facebook.com/ads_archive -> free, 1-2 week review
google_places_key = ""  # set via GOOGLE_PLACES_API_KEY env var

[reddit]
# Create a free "script" app at https://www.reddit.com/prefs/apps (2 minutes).
client_id     = ""
client_secret = ""
user_agent    = "leadforge/1.0 by your_reddit_username"
subreddits    = [
  "forhire", "DesignJobs", "videoediting", "Entrepreneur", "startups",
  "smallbusiness", "ecommerce", "SaaS", "marketing", "ads",
]
queries = [
  "looking for video editor", "need ugc", "hiring video editor",
  "need a 3d website", "looking for animator",
]


# -----------------------------------------------------------------------------
#  OUTREACH TEMPLATES
#  Placeholders: {company} {offer} {signal} {sender} {title} {url}
#  Rule: never send the same first line twice. The {signal} token is filled from
#  what the lead actually said, so every opener is specific and true.
# -----------------------------------------------------------------------------

[outreach]
sender_name = "Naveen"
subject     = "{company} - {offer}?"
body = """Hi,

I saw {signal} - "{title}" - and thought I might be useful.

I run an AI studio. We produce {offer}: ad creative, product video and UGC-style
content generated with our own pipeline, so you get volume and variants without
booking a shoot or a creator every week.

If it helps, I'll make one sample based on what you posted - free, no call, no
deck. You look at it and tell me yes or no.

Worth trying?

{sender}
"""


# -----------------------------------------------------------------------------
#  KEY-FREE SOURCES  (merged in - none of these need an API key or token)
# -----------------------------------------------------------------------------

[sources.reddit_rss]
# Reddit read through public Atom feeds. No OAuth app, no API key, no rate
# limit on the app - only per-IP throttling, so it retries politely.
enabled        = true
rss_subreddits = [
  "forhire", "hiring", "VideoEditing", "editors", "motiongraphics",
  "UGCcreators", "socialmedia", "marketing", "web_design",
]

[sources.meta_ads_open]
# Live advertisers from the PUBLIC Meta Ad Library. No developer token, no
# 1-2 week review. A brand running ads already spends on creative, which makes
# this the warmest free lead source for an AI ad / UGC studio.
enabled     = true
countries   = ["US", "GB"]
media       = "video"          # video | image | all
max_scrolls = 8
headless    = true
queries = [
  "skincare", "supplement", "online course",
]

