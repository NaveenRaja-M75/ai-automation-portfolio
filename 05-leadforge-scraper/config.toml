# =============================================================================
#  LeadForge configuration  ::  edit this, not the code
# =============================================================================

[profile]
name        = "AI Creative Studio"
data_dir    = "data"
timezone    = "Asia/Kolkata"
market      = "global"          # global | india | usa | uk | mena | eu


[limits]
request_delay_ms = 900          # politeness delay per host. 900 = safe. 300 = fast/risky
timeout_s        = 25
crawl_pages      = 5            # pages per prospect site during enrichment
max_per_source   = 150


# -----------------------------------------------------------------------------
#  YOUR OFFERS  -- what you sell. Drives the FIT score.
#  `strong` = an explicit match (20 pts). `weak` = adjacent (8 pts).
#  Add the exact words YOUR buyers use, in their language, not yours.
# -----------------------------------------------------------------------------

[[offers]]
id     = "ai_ugc"
name   = "AI UGC Ads"
pitch  = "infinite UGC ad variants, no creators, no reshoots"
strong = ["ugc", "ugc creator", "ugc creators", "ugc video", "ugc videos",
          "ugc ads", "ugc content", "user generated content",
          "user-generated content", "ai ugc", "creator videos",
          "testimonial video", "testimonial videos", "creator-led ads",
          "creator ads", "founder led video", "talking head ads"]
weak   = ["influencer", "creator content", "social video", "short form video",
          "shorts", "vertical video", "tiktok creator"]

[[offers]]
id     = "ai_ads"
name   = "AI Ad Creative / Performance Ads"
pitch  = "300 ad variants a month at the cost of one shoot"
strong = ["video ad", "video ads", "ad creative", "ad creatives", "ad production",
          "performance creative", "creative testing", "creative refresh",
          "paid social creative", "meta ads creative", "facebook ads creative",
          "tiktok ads creative", "youtube ads creative", "google ads video",
          "video advertising", "ad creative production"]
weak   = ["paid social", "media buying", "facebook ads", "meta ads", "tiktok ads",
          "google ads", "ad campaign", "marketing campaign", "performance marketing",
          "paid media", "ads manager", "creative strategy"]

[[offers]]
id     = "ai_product_ads"
name   = "AI Product Ads & Visuals"
pitch  = "catalog-grade product video and stills without a studio"
strong = ["product video", "product videos", "product photo", "product photos",
          "product photography", "packshot", "packshots", "product demo video",
          "product ad", "product ads", "ecommerce video", "amazon listing video",
          "shopify video", "catalog video", "product visuals", "product rendering",
          "3d product video"]
weak   = ["ecommerce", "e-commerce", "shopify", "amazon seller", "amazon listing",
          "dtc brand", "d2c", "product launch", "listing images", "merchandising",
          "product page", "catalog management"]

[[offers]]
id     = "ai_commercial"
name   = "AI Commercial Ads & Brand Films"
pitch  = "cinematic commercial work at a fraction of a film crew"
# NOTE: bare "commercial" is deliberately NOT here - it matches
# "Commercial Account Executive" and every B2B sales role on earth.
strong = ["tv commercial", "brand commercial", "commercial video",
          "commercial ad", "commercial ads", "brand film", "brand films",
          "cinematic ad", "cinematic ads", "cinematic video", "hero film",
          "campaign film", "spec ad", "commercial spot"]
weak   = ["brand video", "corporate video", "startup video", "brand story",
          "company video", "culture video", "explainer video", "promo video"]

[[offers]]
id     = "web3d"
name   = "3D / Interactive Websites"
pitch  = "immersion that makes the product the landing page"
strong = ["3d website", "3d websites", "3d web", "interactive website",
          "interactive site", "webgl", "three.js", "3d landing page",
          "immersive website", "product configurator", "3d product configurator",
          "virtual showroom", "3d store", "scroll animation website"]
weak   = ["website redesign", "redesign our website", "landing page", "web design",
          "webflow", "framer", "nextjs", "headless commerce", "new website",
          "web developer", "frontend developer"]

[[offers]]
id     = "ai_film"
name   = "AI Films & Animation"
pitch  = "narrative and animated film made with generative pipelines"
# "ai video" alone matches "AI Video Annotator" and "AI video API" - too broad.
strong = ["ai film", "ai films", "generative video", "ai generated video",
          "ai animation", "animated film", "narrative film", "ai short film",
          "ai movie", "ai video production", "ai generated film"]
weak   = ["animation", "animated video", "short film", "documentary",
          "visual effects", "vfx", "motion graphics", "storyboarding"]

[[offers]]
id     = "ai_receptionist"
name   = "AI Receptionist / Voice Agents"
pitch  = "every call answered, every lead booked, 24/7"
strong = ["ai receptionist", "ai answering", "phone answering",
          "virtual receptionist", "voice agent", "voice ai", "ai voice agent",
          "call answering service", "missed call", "missed calls",
          "appointment booking", "answering service", "ai phone agent",
          "ai phone system", "receptionist"]
weak   = ["lead qualification", "booking system", "chatbot",
          "customer support automation", "ai automation", "crm automation",
          "scheduling software", "front desk", "call center"]


# -----------------------------------------------------------------------------
#  SIGNAL VOCABULARY  -- this is what makes the scoring work.
#  Every phrase here is something a BUYER says. Keep them lowercase.
# -----------------------------------------------------------------------------

[keywords]
buy = [
  "looking for", "looking to hire", "we need", "we're looking", "we are looking",
  "i need", "in need of", "seeking", "seeking a", "hire a", "hiring a",
  "need a", "need an", "need someone", "need help with", "want to hire",
  "any recommendations", "can anyone recommend", "who can", "where can i find",
  "recommendations for", "request for proposal", "rfp", "request a quote",
  "outsource", "outsourcing", "budget", "paid work", "urgent", "asap",
  "immediately", "next month", "launching", "we're launching", "rebranding",
  "quoting for", "send me quotes", "taking proposals", "open to proposals",
]

money = [
  "budget", "paid", "compensation", "retainer", "per video", "per month",
  "per project", "usd", "gbp", "eur", "inr", "monthly retainer",
]

# soft penalties  (-20 each)
negative = [
  "unpaid", "for free", "free of charge", "no budget", "equity only",
  "equity-only", "revenue share", "rev share", "revenue-share",
  "internship", "university project", "college project", "school project",
  "volunteer", "pro bono", "portfolio piece", "exposure",
]

# hard rejects -- these are suppliers and students, never buyers
hard_negative = [
  "i am a video editor", "i'm a video editor", "i am a ugc creator",
  "i'm a ugc creator", "i am a videographer", "i'm a videographer",
  "i am a motion designer", "i'm a motion designer", "i am a video producer",
  "hire me", "available for work", "available for hire", "seeking work",
  "i am looking for work", "i'm looking for work", "open to work",
  "my portfolio is", "my showreel", "check out my portfolio",
  "my services include", "i provide video", "we provide video editing",
  "i am a freelancer looking", "willing to relocate", "open to opportunities",
  "seeking a role", "seeking new opportunities", "for hire",
  "looking for a job", "looking for new role", "my cv", "my resume",
  "years of experience in video editing", "i am available for freelance",
]

# stack-overflow / directory style pages, not real buyer posts
extraction_negative = [
  "browse all jobs", "create a job alert", "set up a job alert",
  "subscribe to our newsletter", "sign up for job alerts",
  "jobs by category", "all remote jobs", "page not found",
  "who wants to be hired", "want to be hired",
]

# JOB TITLES that prove a company is investing in creative/video right now.
# On a job board, one of these in the title is a strong FIT signal.
role = [
  "video editor", "videographer", "ugc creator", "content creator",
  "motion designer", "video producer", "creative producer",
  "creative director", "video marketing", "social media manager",
  "brand manager", "performance marketing", "growth marketing",
  "media buyer", "paid social", "animator", "3d artist", "video marketing manager",
  "content marketing manager", "creative strategist", "production manager",
]


# -----------------------------------------------------------------------------
#  SOURCES
# -----------------------------------------------------------------------------

[sources.linkedin_jobs]
enabled  = true
location = "United States"
pages    = 2
queries  = [
  "UGC creator", "video editor marketing", "creative producer",
  "paid social creative", "video ads", "brand video", "product video",
  "motion designer", "3d web developer", "AI video",
]

[sources.hn_search]
enabled = true
queries = [
  "looking for video editor", "looking for video", "need video editor",
  "looking for ugc", "hiring video", "need ad creative", "looking for animator",
  "need 3d website", "looking for motion", "ai receptionist",
]

[sources.websearch]
enabled = true           # ON: home-connection IP + corroboration filter guard it.
# Free web search for buyer-intent phrases. Why it ships disabled by default:
# most engines serve a DEGRADED SERP to datacenter / VPN / proxy IPs - they
# match only the first word and silently ignore quotes and operators. Those
# results look like leads and would waste your sends, so every hit must
# corroborate the query's own words (see _relevant in lf/sources.py). If
# nothing corroborates, the source says so and stores nothing rather than
# inventing rows. From a normal home connection this source works well.
queries = [
  "looking for a video editor",
  "need a UGC creator for my brand",
  "hiring a motion designer",
  "need video ads for my business",
  "looking for a 3d website designer",
  "need an AI receptionist for my clinic",
  "looking for someone to make AI video ads",
  "need a website for my small business",
  "looking for someone to build my website",
]
per_page = 20

[sources.resolve]
# Company-name -> website resolution (used by `enrich`). A WRONG domain is worse
# than no domain, because you would email an unrelated company. So a candidate
# is accepted only when its domain label strictly matches the company name
# (get-/use-/try- affixes allowed) AND the live site's own title / og:site_name /
# h1 corroborates the name. Names shorter than 5 characters are skipped as too
# ambiguous to resolve safely.
via_search = true        # one focused search lookup per unresolved company

[sources.meta_ads]
enabled = true
country = "US"
queries = ["shop now", "limited time", "new launch", "book now"]

[sources.weworkremotely]
enabled    = true
categories = ["remote-design-jobs", "remote-marketing-jobs", "remote-product-jobs",
              "remote-all-other-remote-jobs"]

[sources.osm_local]
enabled   = true
radius_km = 6

[[sources.osm_local.targets]]
label  = "Jewelry store"
filter = 'shop="jewelry"'
cities = [
  { name = "New York",  lat = 40.7128, lon = -74.0060 },
