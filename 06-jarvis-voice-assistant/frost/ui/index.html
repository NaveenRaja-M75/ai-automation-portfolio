<!doctype html>
<meta charset="utf-8">
<title>FROST</title>
<style>
  :root{
    --bg:#05070b; --panel:rgba(12,18,26,.72); --line:rgba(94,132,168,.16);
    --fg:#c9d6e4; --dim:#5d6f83; --accent:#4db8ff; --ok:#5ee6a8; --warn:#ffc857;
  }
  *{box-sizing:border-box}
  /* --- Layout -------------------------------------------------------------
     Grid, not floating panels.

     Everything here used to be `position:fixed` stacked over a full-screen
     canvas. That guarantees collisions: the log grew upward into the reactor,
     the reactor sat under the filter card, and every fix was a coordinate
     patched against one window size. Grid regions cannot overlap — the browser
     allocates the space — so the whole class of bug disappears rather than
     being managed.

     Three columns: the vault on the left, the graph in the middle, FROST on the
     right. The reactor is pinned at the top of its own column and never yields
     to anything: it is the face of the thing, not decoration. */
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.5 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  body{display:grid;gap:12px;padding:12px;
    grid-template-columns:262px minmax(0,1fr) 340px;
    grid-template-areas:"side graph chat"}
  #side{grid-area:side;min-height:0;overflow:auto}
  #graphwrap{grid-area:graph;position:relative;min-width:0;min-height:0}
  #chat{grid-area:chat;min-height:0;display:flex;flex-direction:column;gap:10px}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  #reactor{display:block}
  .panel{background:var(--panel);border:1px solid var(--line);
    border-radius:12px;backdrop-filter:blur(14px);padding:14px}

  h1{margin:0;font:600 13px/1.2 Consolas,monospace;letter-spacing:.22em;color:var(--accent)}
  .sub{color:var(--dim);font:10px/1.6 Consolas,monospace;margin-top:3px}
  #side{display:flex;flex-direction:column;gap:14px}
  #bottom{display:flex;gap:8px;align-items:center;padding:8px;flex:0 0 auto}
  input,button{font:inherit;color:var(--fg);background:transparent;border:0;outline:0}
  #ask{flex:1;padding:7px 10px}
  #ask::placeholder{color:var(--dim)}
  button{cursor:pointer;border-radius:8px;padding:7px 11px;border:1px solid var(--line)}
  button:hover{border-color:var(--accent);color:var(--accent)}
  .sect{font:10px/1.6 Consolas,monospace;color:var(--dim);letter-spacing:.14em;margin-bottom:6px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;cursor:pointer}
  .row:hover{color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
  .num{color:var(--dim);font:10px Consolas,monospace}
  #note{white-space:pre-wrap;font:11px/1.6 Consolas,monospace;color:var(--dim);
    max-height:190px;overflow:auto}
  #note b{color:var(--fg);font-weight:600}
  #note code{color:var(--accent)}
  #note a{color:var(--accent);text-decoration:none;border-bottom:1px dotted}
  #note .meta{color:#48576a;font-size:10px;margin-bottom:7px}
  /* Its own grid region now: flex:1 so it takes whatever the reactor and the
     input bar leave, min-height:0 so it actually scrolls instead of stretching
     the column, and no cap on history -- the old 14-message limit silently
     destroyed everything older, which is why scrolling back was impossible. */
  #log{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    display:flex;flex-direction:column;gap:8px;font-size:12.5px;
    padding:12px;scroll-behavior:smooth}
  #log::-webkit-scrollbar{width:8px}
  #log::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .you{color:var(--ok)} .frost{color:var(--fg)} .st{color:var(--dim);font:10px Consolas,monospace}
  /* Pinned at the top of FROST's column. Previously it was hidden when space
     got tight, on the theory that it was decoration. It is not -- it is the
     face of the assistant, and losing it was the single worst regression of
     the old layout. It now has its own space that nothing else can claim. */
  #hud{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
    gap:7px;padding:12px 14px 10px}
  #state{font:10px Consolas,monospace;letter-spacing:.2em;color:var(--dim)}
  #online{display:flex;align-items:center;gap:7px}
  #online .dot{margin:0;background:var(--dim);box-shadow:0 0 8px currentColor}
  #chip{font:9px Consolas,monospace;letter-spacing:.12em;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  .hint{font-size:11px;color:var(--dim);line-height:1.45;margin:-2px 0 7px}
  #search{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
  #kinds{display:flex;flex-wrap:wrap;gap:5px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
    font:10px Consolas,monospace;border-radius:999px;border:1px solid var(--line);
    color:var(--fg);cursor:pointer}
  .chip .dot{width:6px;height:6px;margin:0}
  .chip .num{margin-left:1px}
  .chip.off{opacity:.32}
  .chip:hover{border-color:var(--accent)}
  /* Conversation lines. `you` and FROST need to be separable at a glance while
     scrolling back through a long day. */
  #log .you{color:var(--ok);align-self:flex-end;max-width:92%;text-align:right}
  #log .frost{color:var(--fg);max-width:96%}
  #log .st{color:var(--dim);font:10px/1.5 Consolas,monospace;opacity:.75}
  /* --- Breakpoints, last on purpose --------------------------------------
     These must come after every base rule. Placed earlier, `#side{display:flex}`
     below them won on source order and the sidebar refused to hide -- which
     collapsed the graph column to zero width. Same specificity, later wins.

     Narrow: the vault column is the first to go — it is reference, while the
     graph and the conversation are the things being used. */
  @media (max-width:1180px){
    body{grid-template-columns:minmax(0,1fr) 320px;
         grid-template-areas:"graph chat"}
    #side{display:none}
  }
  /* Narrower still: stack rather than squeeze. A 200px-wide graph is not a
     graph, and a 200px-wide conversation is not readable. */
  @media (max-width:820px){
    body{grid-template-columns:minmax(0,1fr);
         grid-template-rows:minmax(120px,32vh) minmax(0,1fr);
         grid-template-areas:"graph" "chat"}
  }
</style>

<div id="side" class="panel">
  <h1>F R O S T</h1>
  <div class="sub" id="stats">loading…</div>
  <input id="search" placeholder="search the brain…">
  <div>
    <div class="sect">TOP HUBS</div>
    <div id="hubs"></div>
  </div>
  <div>
    <div class="sect">SELECTED</div>
    <div id="note">Click any dot in the graph.</div>
  </div>
  <!-- The filter was a whole card of its own for eight types across fifteen
       notes. Demoted to chips: same control, a tenth of the space, and it can
       grow back into a list if the vault ever gets big enough to need one. -->
  <div>
    <div class="sect">SHOW</div>
    <div id="kinds"></div>
  </div>
</div>

<div id="graphwrap"><canvas id="c"></canvas></div>

<div id="chat">
  <div id="hud" class="panel">
    <canvas id="reactor" width="168" height="168"></canvas>
    <div id="online"><span class="dot" id="odot"></span><span id="state">ONLINE</span></div>
    <div id="chip">◆ <span id="modelname">—</span></div>
  </div>
  <div id="log" class="panel"></div>
  <div id="bottom" class="panel">
    <input id="ask" placeholder='ask… or press the mic and speak'>
    <button id="mic" title="talk">🎙</button>
    <button id="send">send</button>
  </div>
</div>

<script>
const KIND_COLOUR = {
  project:'#ffb454', area:'#c678dd', resource:'#4db8ff', archive:'#4a5a6a',
  person:'#e06c9f', daily:'#5ee6a8', inbox:'#ffc857', template:'#3f5163',
  meta:'#7f9bb5', note:'#4db8ff', missing:'#37475a'
};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let G = {nodes:[],edges:[]}, N=[], E=[], hidden=new Set();
let focus=null, hover=null, cam={x:0,y:0,z:1}, t=0;

// The canvas fills a grid cell now, not the viewport, so it must measure
// itself. Using innerWidth here drew a full-screen graph into a third of the
// screen -- everything offset and clipped.
function cvSize(){ const r=cv.getBoundingClientRect();
  return [Math.max(1,Math.round(r.width)), Math.max(1,Math.round(r.height))]; }
function resize(){
  const [w,h]=cvSize();
  cv.width=w*devicePixelRatio; cv.height=h*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
addEventListener('resize',resize); resize();
// A page that loads in a hidden tab reports innerWidth 0, and the resize event
// never fires when it becomes visible — so the graph would stay a blank canvas
// forever. Re-check each frame; it is two integer compares.
function ensureSized(){
  const [w,h]=cvSize();
  if(cv.width!==w*devicePixelRatio || cv.height!==h*devicePixelRatio) resize();
}
// requestAnimationFrame is suspended while a tab is hidden or not compositing,
// so a check inside the draw loop never runs in exactly the case that needs it.
// ResizeObserver fires on layout regardless of rAF, so the canvas recovers the
// moment the window is actually shown.
if(window.ResizeObserver) new ResizeObserver(ensureSized).observe(document.body);
setInterval(ensureSized, 1000);

async function load(){
  G = await (await fetch('/api/graph')).json();
  const byId = {};
  N = G.nodes.map(n=>{
    const o = {...n, x:(Math.random()-.5)*600, y:(Math.random()-.5)*600, vx:0, vy:0,
      deg:(n.links||0)+(n.backlinks||0)};
    byId[n.id]=o; return o;
  });
  E = G.edges.map(e=>({s:byId[e.source], t:byId[e.target]})).filter(e=>e.s&&e.t);
  document.getElementById('stats').textContent =
    `${G.stats.notes} notes · ${G.stats.connections} connections`;
  const m=(G.meta&&G.meta.model||'').replace('claude-','').toUpperCase();
  document.getElementById('modelname').textContent = m || 'LOCAL';
  document.getElementById('state').textContent='ONLINE';
  document.getElementById('odot').style.background=STATE_COL.idle;
  document.getElementById('odot').style.color=STATE_COL.idle;
  document.getElementById('state').style.color=STATE_COL.idle;
  renderKinds(); renderHubs(); layoutHud();
}

// The filter card grows with the number of note types, so the reactor's offset
// can't be a constant — measure the card and sit a fixed gap below it.
// Grid owns the layout now. Kept as a no-op so existing call sites (and the
// muscle memory of anyone reading the old version) do not break.
function layoutHud(){}
addEventListener('resize', layoutHud);
// rAF is suspended in a hidden tab, so this cannot live in the draw loop --
// same reason `ensureSized` does not. Cheap enough to just re-run.
if(window.ResizeObserver) new ResizeObserver(layoutHud).observe(document.body);

// Chips, not rows. Eight one-line rows to filter fifteen notes was a card's
// worth of screen for a control that is barely used at this size.
function renderKinds(){
  document.getElementById('kinds').innerHTML = Object.entries(G.counts).map(([k,v])=>
    `<button class="chip" data-k="${k}" title="click to hide ${k} notes"><span class="dot" style="background:${KIND_COLOUR[k]||'#888'}"></span>${k}<span class="num">${v}</span></button>`
  ).join('');
  document.querySelectorAll('#kinds .chip').forEach(r=>r.onclick=()=>{
    const k=r.dataset.k; hidden.has(k)?hidden.delete(k):hidden.add(k);
    r.classList.toggle('off', hidden.has(k));
  });
}
function renderHubs(){
  document.getElementById('hubs').innerHTML = G.hubs.map(h=>
    `<div class="row" data-id="${h.id}"><span>${h.label}</span><span class="num">${h.score}</span></div>`).join('');
  document.querySelectorAll('#hubs .row').forEach(r=>r.onclick=()=>select(r.dataset.id));
}

// --- force layout: repulsion is capped by distance so cost stays near-linear
function step(){
  const K=90;
  for(let i=0;i<N.length;i++){
    const a=N[i];
    for(let j=i+1;j<N.length;j++){
      const b=N[j]; let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if(d2>90000||d2<.01) continue;
      const d=Math.sqrt(d2), f=K*K/d2*0.9;
      const ux=dx/d, uy=dy/d;
      a.vx-=ux*f; a.vy-=uy*f; b.vx+=ux*f; b.vy+=uy*f;
    }
  }
  for(const e of E){
    const dx=e.t.x-e.s.x, dy=e.t.y-e.s.y, d=Math.hypot(dx,dy)||1;
    const f=(d-110)*0.014, ux=dx/d, uy=dy/d;
    e.s.vx+=ux*f; e.s.vy+=uy*f; e.t.vx-=ux*f; e.t.vy-=uy*f;
  }
  for(const n of N){
    n.vx-=n.x*0.0015; n.vy-=n.y*0.0015;      // gentle pull to centre
    n.vx*=0.86; n.vy*=0.86; n.x+=n.vx; n.y+=n.vy;
  }
}

const R = n => 3 + Math.min(13, Math.sqrt(n.deg)*2.6);
const visible = n => !hidden.has(n.kind);
function screenOf(n){ return {x:innerWidth/2+(n.x+cam.x)*cam.z, y:innerHeight/2+(n.y+cam.y)*cam.z}; }

function draw(){
  t+=0.016; ensureSized(); step();
  ctx.clearRect(0,0,innerWidth,innerHeight);
  const lit = focus ? new Set([focus.id, ...E.filter(e=>e.s.id===focus.id||e.t.id===focus.id)
      .flatMap(e=>[e.s.id,e.t.id])]) : null;

  for(const e of E){
    if(!visible(e.s)||!visible(e.t)) continue;
    const a=screenOf(e.s), b=screenOf(e.t);
    const on = !lit || (lit.has(e.s.id)&&lit.has(e.t.id));
    ctx.strokeStyle = on ? 'rgba(77,184,255,.30)' : 'rgba(90,120,150,.05)';
    ctx.lineWidth = on?1:.6;
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }

  const placed=[];
  const order=[...N].filter(visible).sort((a,b)=>b.deg-a.deg);
  for(const n of order){
    const p=screenOf(n), r=R(n)*cam.z;
    const on = !lit || lit.has(n.id);
    const col = KIND_COLOUR[n.kind]||'#888';
    ctx.globalAlpha = on?1:.12;
    if(n===hover||n===focus){ ctx.shadowBlur=18; ctx.shadowColor=col; }
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.fillStyle=col; ctx.fill();
    ctx.shadowBlur=0;
    // Labels for hubs only, and only where they don't collide.
    if(on && (n.deg>=2 || n===hover) && cam.z>.55){
      const w=ctx.measureText(n.label).width*0.62+8, box={x:p.x+r+4,y:p.y-7,w,h:14};
      if(!placed.some(q=>Math.abs(q.x-box.x)<q.w&&Math.abs(q.y-box.y)<14)){
        placed.push(box);
        ctx.font='10px Consolas,monospace'; ctx.fillStyle='rgba(201,214,228,.82)';
        ctx.fillText(n.label, p.x+r+5, p.y+3);
      }
    }
    ctx.globalAlpha=1;
  }
  drawPulses();
  requestAnimationFrame(draw);
}

// --- interaction
let drag=null;
cv.onmousedown=e=>drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
onmouseup=()=>drag=null;
cv.onmousemove=e=>{
  if(drag){ cam.x=drag.cx+(e.clientX-drag.x)/cam.z; cam.y=drag.cy+(e.clientY-drag.y)/cam.z; return; }
  hover=null;
  for(const n of N){ if(!visible(n))continue;
    const p=screenOf(n); if(Math.hypot(p.x-e.clientX,p.y-e.clientY)<R(n)*cam.z+5){hover=n;break;} }
  cv.style.cursor = hover?'pointer':'grab';
};
cv.onclick=e=>{ if(hover) select(hover.id); else { focus=null; } };
cv.onwheel=e=>{ e.preventDefault(); cam.z=Math.min(3,Math.max(.25,cam.z*(e.deltaY<0?1.12:0.89))); };

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Frontmatter is machine plumbing; showing `created: {{date}}` to a human is
// noise. Strip it, then apply just enough markdown to read comfortably.
function renderNote(md){
  let meta = '';
  md = md.replace(/^---\n([\s\S]*?)\n---\n?/, (_m, block) => {
    const tags = /tags:\s*\[([^\]]*)\]/.exec(block);
    const when = /(?:created|updated):\s*(\S+)/.exec(block);
    const bits = [when && when[1], tags && tags[1]].filter(Boolean);
    meta = bits.length ? `<div class="meta">${esc(bits.join('  ·  '))}</div>` : '';
    return '';
  });
  const body = esc(md.trim())
    .replace(/^#{1,6}\s*(.+)$/gm, '<b>$1</b>')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    // `[[note|alias]]` should read as the alias, not the path.
    .replace(/\[\[([^\]|\n]+)(?:\|([^\]\n]+))?\]\]/g,
             (_m, target, alias) => `<a href="#" data-link="${target}">${alias || target}</a>`)
    .replace(/^\s*[-*]\s+/gm, '• ');
  return meta + body;
}

async function select(id){
  focus = N.find(n=>n.id===id)||null;
  const r = await (await fetch('/api/note?id='+encodeURIComponent(id))).json();
  const el = document.getElementById('note');
  el.innerHTML = renderNote(r.text.slice(0, 2600));
  // Links inside a note navigate the graph, so reading and exploring are the
  // same gesture.
  el.querySelectorAll('a[data-link]').forEach(a => a.onclick = e => {
    e.preventDefault(); select(a.dataset.link.split('/').pop().toLowerCase());
  });
}
document.getElementById('search').oninput = e=>{
  const q=e.target.value.toLowerCase().trim();
  focus = q ? N.find(n=>n.label.toLowerCase().includes(q))||null : null;
  if(focus) select(focus.id);
};

// --- reactor HUD, modelled on the Iron Man arc-reactor look:
// tick ring, counter-rotating segmented arcs, an amber accent sweep, and the
// name held still in the middle so it reads as an instrument, not a spinner.
const rEl=document.getElementById('reactor'), rc=rEl.getContext('2d');
let state='idle';
const STATE_COL={idle:'#2f9fd0',listening:'#5ee6a8',thinking:'#ffc857',speaking:'#4db8ff'};
const AMBER='#ff9f45';
function arc(cx,cy,r,a0,a1,col,w,alpha){
  rc.beginPath(); rc.arc(cx,cy,r,a0,a1); rc.strokeStyle=col;
  rc.lineWidth=w; rc.globalAlpha=alpha; rc.stroke(); rc.globalAlpha=1;
}
function reactor(){
  const S=rEl.width, c=S/2, col=STATE_COL[state]||'#2f9fd0';
  const sp={idle:.35,listening:1.5,thinking:1.1,speaking:2.0}[state]||.35;
  rc.clearRect(0,0,S,S);

  // tick ring
  for(let i=0;i<60;i++){
    const a=i*Math.PI/30, long=i%5===0, r0=c*.95, r1=c*(long?.86:.90);
    rc.beginPath();
    rc.moveTo(c+Math.cos(a)*r0, c+Math.sin(a)*r0);
    rc.lineTo(c+Math.cos(a)*r1, c+Math.sin(a)*r1);
    rc.strokeStyle=col; rc.globalAlpha=long?.55:.22; rc.lineWidth=1; rc.stroke();
  }
  rc.globalAlpha=1;

  // segmented outer arcs, rotating
  const p=t*sp;
  for(const [start,len] of [[0,1.9],[2.4,1.2],[4.1,1.6]]) arc(c,c,c*.80,p+start,p+start+len,col,2,.85);
  // counter-rotating inner arcs
  for(const [start,len] of [[0.6,2.4],[3.6,2.0]]) arc(c,c,c*.66,-p*1.3+start,-p*1.3+start+len,col,1.5,.5);
  // amber accent sweep
  arc(c,c,c*.73,-p*0.8, -p*0.8+2.2, AMBER, 3, .95);
  // dotted inner circle
  rc.setLineDash([2,5]); arc(c,c,c*.50,0,7,col,1,.45); rc.setLineDash([]);
  // core glow, breathing
  const core=c*.40+Math.sin(t*sp*2)*2;
  const grd=rc.createRadialGradient(c,c,0,c,c,core);
  grd.addColorStop(0, col+'55'); grd.addColorStop(1, 'transparent');
  rc.beginPath(); rc.arc(c,c,core,0,7); rc.fillStyle=grd; rc.fill();

  // the name, held still
  rc.font='bold 13px Consolas,monospace'; rc.textAlign='center'; rc.textBaseline='middle';
  rc.fillStyle=col; rc.fillText('F.R.O.S.T.', c, c);
  rc.textAlign='start'; rc.textBaseline='alphabetic';
  requestAnimationFrame(reactor);
}

// --- tool activity: a ring expanding out of the reactor, plus the tool name.
// Watching an assistant sit silent for ten seconds feels broken even when it
// is working; showing which tool fired makes the wait legible.
let pulses=[], toolName='', toolUntil=0;
function pulse(name){
  toolName = name.replace(/^mcp__/,'').replace(/__/,' · ');
  toolUntil = performance.now()+2600;
  pulses.push({born:performance.now()});
  if(pulses.length>6) pulses.shift();
}
function drawPulses(){
  const now=performance.now();
  pulses = pulses.filter(p=>now-p.born<1800);
  if(!pulses.length && now>toolUntil) return;
  // Both rects are viewport-space; the canvas no longer starts at 0,0, so its
  // origin has to come off or the rings appear offset from the reactor.
  const hud=document.getElementById('reactor').getBoundingClientRect();
  const box=cv.getBoundingClientRect();
  const cx=hud.left+hud.width/2-box.left, cy=hud.top+hud.height/2-box.top;
  for(const p of pulses){
    const k=(now-p.born)/1800, r=40+k*260;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,7);
    ctx.strokeStyle=STATE_COL[state]||'#4db8ff';
    ctx.globalAlpha=(1-k)*0.30; ctx.lineWidth=2; ctx.stroke(); ctx.globalAlpha=1;
  }
  if(now<toolUntil && toolName){
    ctx.font='10px Consolas,monospace'; ctx.textAlign='center';
    ctx.fillStyle=STATE_COL[state]||'#4db8ff'; ctx.globalAlpha=.8;
    ctx.fillText(toolName, cx, cy+118); ctx.globalAlpha=1; ctx.textAlign='start';
  }
}

// --- live events
const log=document.getElementById('log');
function line(cls,txt){
  const d=document.createElement('div'); d.className=cls; d.textContent=txt;
  log.appendChild(d); while(log.children.length>400) log.removeChild(log.firstChild);
  log.scrollTop=log.scrollHeight;
}
const es=new EventSource('/api/events');
es.onmessage=m=>{
  const {kind,text}=JSON.parse(m.data);
  if(kind==='state'){
    state=text;
    const col=STATE_COL[text]||'#5d6f83';
    const lbl=document.getElementById('state');
    lbl.textContent = text==='idle' ? 'ONLINE' : text.toUpperCase();
    lbl.style.color=col;
    document.getElementById('odot').style.background=col;
    document.getElementById('odot').style.color=col;
  }
  else if(kind==='user') line('you',text);
  else if(kind==='frost') line('frost',text);
  else if(kind==='status'){
    line('st','· '+text);
    const m=/using (\S+)/.exec(text);
    if(m) pulse(m[1]);
  }
};

document.getElementById('mic').onclick=()=>fetch('/api/talk',{method:'POST'});
function send(){
  const el=document.getElementById('ask'), v=el.value.trim(); if(!v)return;
  fetch('/api/ask',{method:'POST',body:JSON.stringify({text:v})}); el.value='';
}
document.getElementById('send').onclick=send;
document.getElementById('ask').onkeydown=e=>{ if(e.key==='Enter') send(); };

load().then(()=>{draw();reactor();});
</script>
